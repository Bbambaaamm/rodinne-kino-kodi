name: Quality Gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functional-tests:
    name: Functional tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run all automated tests
        run: python -m unittest discover -s tests -v

  quality-contract:
    name: Quality contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify budgets and Homatics evidence
        run: python scripts/check_quality_gates.py
      - name: Build Kodi packages
        run: python build.py
      - name: Re-run release integrity tests after build
        run: python -m unittest tests.test_release_history tests.test_updates -v
